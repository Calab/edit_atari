[package]
name = "retro_sdl"
description = "SDL2 front end shared by the retro text editors"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fontdue = "0.9.5"
retro_core = { path = "../retro_core" }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
sdl2 = { version = "0.39.0", features = ["bundled", "static-link"] }
