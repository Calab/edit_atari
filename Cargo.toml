[workspace]
resolver = "2"
members = [
    "crates/retro_core",
    "crates/atari",
    "crates/retro_sdl",
    "apps/atari_editor",
    "tools/fontgen",
]

[workspace.package]
authors = ["Steve Norton", "Claude AI"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Calab/edit_atari"
version = "1.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
