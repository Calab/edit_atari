[workspace]
resolver = "2"
members = [
    "crates/retro_core",
    "crates/atari",
    "crates/retro_sdl",
    "apps/atari_editor",
    "tools/fontgen",
]

[workspace.package]
authors = ["Calab"]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
