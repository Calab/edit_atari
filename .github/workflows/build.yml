name: Build

# Every push builds and tests on Linux, Windows and macOS (Apple Silicon
# and Intel). Pushing a tag such as v1.0.0 also publishes a GitHub Release
# with the four packages attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc, so the binary runs on more distros
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          # Oldest macOS each Mac build runs on: 11 is the first release for
          # Apple Silicon; 10.13 covers most Intel Macs still in use.
          - os: macos-latest
            name: macos-apple-silicon
            macos_min: "11.0"
          - os: macos-15-intel
            name: macos-intel
            macos_min: "10.13"
    runs-on: ${{ matrix.os }}
    # Rust, the C compiler and CMake (which builds the bundled SDL) all read
    # this. Without it SDL targets the build machine's own macOS version.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install SDL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl-dev libasound2-dev libpulse-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2

      # Code style and lint warnings, checked once (on Linux).
      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p atari_editor

      - name: Package
        shell: bash
        run: |
          version=$(cargo pkgid -p atari_editor | sed 's/.*[#@]//')
          dir="atari_editor-$version-${{ matrix.name }}"
          mkdir -p "$dir/fonts"
          cp LICENSE README.md apps/atari_editor/THIRD_PARTY.txt "$dir/"
          cp "assets/fonts/atari/EightBit Atari-Regular.ttf" "$dir/fonts/"
          cp "assets/fonts/atari/OFL.txt" "$dir/fonts/EightBit Atari OFL.txt"
          cp "assets/fonts/atari/Atari font license.txt" "$dir/fonts/"
          cp assets/fonts/ui/OFL.txt "$dir/fonts/Noto Sans OFL.txt"
          # Atari .FNT fonts for Options > Fonts.
          mkdir "$dir/fonts/FNT"
          cp assets/fonts/FNT/* "$dir/fonts/FNT/"
          case "${{ runner.os }}" in
            Linux)
              cp target/release/atari_editor "$dir/"
              cp packaging/linux/install.sh packaging/linux/atari_editor.desktop "$dir/"
              mkdir "$dir/icons"
              cp assets/icons/atari_editor-*.png "$dir/icons/"
              # tar keeps the programs executable.
              tar czf "$dir.tar.gz" "$dir"
              echo "PACKAGE=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            Windows)
              cp target/release/atari_editor.exe assets/icons/atari_editor.ico "$dir/"
              7z a -tzip "$dir.zip" "$dir" > /dev/null
              echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
              ;;
            macOS)
              app="$dir/Edit Atari.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp target/release/atari_editor "$app/MacOS/"
              cp assets/icons/atari_editor.icns "$app/Resources/"
              # Inside the app too, so Options > Fonts finds them wherever
              # the app is moved to.
              cp -R assets/fonts/FNT "$app/Resources/"
              sed -e "s/MACOS_MIN/$MACOSX_DEPLOYMENT_TARGET/g" -e "s/VERSION/$version/g" \
                packaging/macos/Info.plist > "$app/Info.plist"
              # Ad-hoc signature (not notarized): macOS still asks the
              # first time it's opened.
              codesign --force --deep --sign - "$dir/Edit Atari.app"
              ditto -c -k --keepParent "$dir" "$dir.zip"
              echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
              ;;
          esac

      # The package itself, not wrapped in another zip: the artifact is
      # named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # Keep the .zip packages as they are.
          skip-decompress: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
